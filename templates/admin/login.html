{% extends "base.html" %}
{% block title %}Вход — Пёс-Компас{% endblock %}
{% block content %}
<h1 class="page">Переписки</h1>
<p class="lead">Вход для просмотра чатов. Сюда можно зайти с телефона и с компьютера.</p>
<form method="post" action="{{ url_for('admin_login') }}" class="composer">
  <label class="field">
    <span>Пароль</span>
    <input type="password" name="password" autofocus>
  </label>
  {% if error %}<p class="note bad">{{ error }}</p>{% endif %}
  <button type="submit">Войти</button>
</form>
{% endblock %}
